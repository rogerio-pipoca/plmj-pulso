<html lang="pt-PT">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#009CD1;--roxo:#572068;--ink:#231F20;--bg:#ffffff;--card:#f5f7f9;--line:#dfe5ea;--muted:#6b7680;--ok:#1a9c6b;--tint:#F3F8FB;--tintp:#F5F0F7}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Open Sans",Arial,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em;line-height:1.15}

.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 18px;border-bottom:3px solid var(--azul);margin-bottom:22px}
.top .brand{font-family:"Playfair Display",serif;font-weight:900;font-size:1.1rem;color:var(--azul)}
.top .sub{font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.q{margin:0 0 20px}
.q .t{font-weight:600;margin:0 0 10px}
.q .n{display:inline-block;font-family:"Playfair Display",serif;color:var(--azul);font-weight:900;margin-right:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 8px;font:inherit;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--azul);background:#e8f6fb;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .opt{flex:1 1 auto;width:auto;min-width:56px;text-align:center}
textarea,input[type=text]{width:100%;font:inherit;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
a.primary,button.primary{display:block;width:100%;background:var(--azul);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:10px}

.muted{color:var(--muted);font-size:.9rem}
.center{text-align:center}
.big{font-family:"Playfair Display",serif;font-size:2.2rem;color:var(--roxo);line-height:1.1}
.err{background:#fdecec;border:1px solid #f3b4b4;color:#8a1c1c;padding:12px;border-radius:10px;margin-bottom:14px}
/* ---- tela (só resultados, reserva) ---- */
.tela .wrap{max-width:1500px;padding:28px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.panel h3{font-size:1.15rem;color:var(--roxo);margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(140px,2.2fr) 5fr 44px;align-items:center;gap:10px;margin:7px 0;font-size:1rem}
.bar .lab{color:var(--ink)} .bar .trk{background:#eef2f5;border-radius:6px;height:22px;overflow:hidden}

.bar.alt .fil{background:var(--roxo)} .bar .val{text-align:right;font-weight:700;color:var(--roxo)}
.kpi{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 18px}
.kpi div{font-size:.95rem;color:var(--muted)} .kpi b{display:block;font-family:"Playfair Display",serif;font-size:2rem;color:var(--azul);line-height:1}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr img,.qr canvas{border:10px solid #fff;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.verb{background:#f5f7f9;border-left:4px solid var(--roxo);padding:10px 14px;margin:8px 0;border-radius:6px;font-size:1.05rem}
.tag{display:inline-block;background:var(--roxo);color:#fff;font-size:.75rem;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;letter-spacing:.3px}
.adminbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px;align-items:center}
.adminbar button{font:inherit;padding:9px 14px;border-radius:10px;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font-weight:600;cursor:pointer}
.adminbar button.on{background:var(--azul);color:#fff}
.adminbar button.big{font-size:1.4rem;padding:10px 22px}
.slidelist{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.slidelist button{font:inherit;text-align:left;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.slidelist button.on{border-color:var(--roxo);background:var(--tintp);font-weight:700}
.slidelist button .k{display:inline-block;width:28px;color:var(--azul);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:.95rem} table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left} table.t th{color:var(--roxo)}
@media (max-width:480px){html,body{font-size:16px}.big{font-size:1.8rem}}

/* ---- ECRÃ (slides integrados) ---- */

 position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:top left;background:var(--paper);color:var(--ink);overflow:hidden;font-size:26px;line-height:1.4;font-weight:400}

.stage .numtitle{display:flex;align-items:center;gap:18px;margin-bottom:30px}
.stage p{margin:0 0 16px}
.stage .lead{font-family:"Playfair Display",serif;font-size:38px;line-height:1.22;font-weight:700}
.stage .it{font-style:italic} .stage .b{font-weight:700} .stage .small{font-size:19px;color:var(--soft)} .stage .soft{color:var(--soft)} .stage .dim{color:var(--dim)}
.stage .blue{color:var(--azul)} .stage .pu{color:var(--lav)}
.stage .card{background:var(--panel);border:2.5px solid var(--ink);border-radius:6px;padding:26px 30px;margin:0;box-shadow:8px 8px 0 var(--ink)}
.stage .card.hi{background:#DFF4FB;box-shadow:8px 8px 0 var(--azul)} .stage .card.dim{background:#F1EDE4;box-shadow:8px 8px 0 #C9C2B4;border-color:#9A948A;color:var(--soft)}

.stage .cols2{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:28px} .stage .cols2.w40{grid-template-columns:4fr 6fr} .stage .cols2.w55{grid-template-columns:55fr 45fr}

.stage .stats b{display:block;font-family:"Playfair Display",serif;font-size:120px;line-height:1;margin-bottom:14px;color:var(--coral);letter-spacing:-3px} .stage .stats p{font-size:22px} .stage .stats .src{font-size:14px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-weight:700}

.stage .routes b{font-family:"Playfair Display",serif;font-size:56px;display:block;margin-bottom:8px;color:var(--dim)} .stage .routes p{font-size:22px} .stage .routes .rk{font-style:italic;color:var(--soft);font-size:19px} .stage .routes.big p{font-size:31px;line-height:1.35} .stage .routes.big .rk{font-size:25px} .stage .routes.big b{font-size:84px} .stage .routes.big .card{padding:34px 36px;min-height:520px}

.stage .tpl p{font-family:"Playfair Display",serif;font-size:38px;color:var(--ink);font-weight:700;margin:0 0 18px} .stage .tpl p::before{content:"→ ";color:var(--coral)}
.stage .q{font-family:"Playfair Display",serif;font-size:30px;font-weight:700;color:var(--azul);border-top:2px solid var(--ink);padding-top:16px}
.stage .quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:460px;margin-left:auto}

.stage .quad .p{background:var(--lav)}

.stage table.cy{width:100%;border-collapse:separate;border-spacing:0;font-size:21px;margin-bottom:16px} .stage table.cy th{color:var(--ink);font-family:"Playfair Display",serif;font-size:32px;padding:10px 14px;text-align:left;border-bottom:3px solid var(--ink)} .stage table.cy td{border-bottom:1px solid rgba(20,25,43,.25);padding:12px 14px;vertical-align:top;color:var(--soft)} .stage table.cy td.lab{color:var(--dim);font-size:14px;letter-spacing:2px;text-transform:uppercase;width:140px;padding-top:16px;font-weight:700} .stage table.cy td.ex{font-family:"Playfair Display",serif;font-size:27px;color:var(--ink);font-weight:700} .stage table.cy td.b{color:var(--ink);font-weight:700}
.stage table.cy th:nth-child(2){color:var(--mint)} .stage table.cy th:nth-child(3){color:var(--azul)} .stage table.cy th:nth-child(4){color:var(--lav)} .stage table.cy th:nth-child(5){color:var(--coral)}
.stage .caso{font-size:24px;background:#fff;border:2.5px solid var(--ink);box-shadow:8px 8px 0 var(--must);padding:22px 26px;border-radius:6px;color:var(--ink)}
.stage .timing div{font-size:22px;margin:8px 0;color:var(--soft)} .stage .timing b{display:inline-block;width:110px;color:var(--coral)}
.stage .livebox{min-height:300px} .stage .livebox .lpanel{padding:20px 24px;min-height:300px} .stage .livebox .bar{font-size:18px;grid-template-columns:190px 1fr 56px} .stage .livebox h3{font-size:22px}

.stage .lpanel h3{font-size:19px;color:var(--ink);margin-bottom:8px;line-height:1.2} .stage .lpanel .muted{color:var(--dim)}
.stage .bar{font-size:16px;line-height:1.2;grid-template-columns:150px 1fr 50px;margin:5px 0;gap:8px} .stage .bar .trk{height:16px;background:#EEE9DF;border-radius:3px} .stage .bar .fil{border-radius:3px} .stage .bar .lab{overflow:hidden;color:var(--soft)} .stage .bar .val{color:var(--ink)} .stage .bar.alt .fil{background:var(--coral)}
.stage table.t td,.stage table.t th{border-color:rgba(20,25,43,.2)} .stage table.t th{color:var(--coral)}
.stage .count{position:absolute;top:56px;right:180px;font-size:18px;color:var(--soft)} .stage .count b{font-family:"Playfair Display",serif;font-size:34px;color:var(--coral);margin-right:6px}
.stage .verb{font-size:17px;line-height:1.3;padding:6px 10px;margin:5px 0;background:#F7F3EC;border-left:4px solid var(--coral);color:var(--ink)}
.stage .after{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding-top:40px}
.stage .quote{font-family:"Playfair Display",serif;font-weight:900;font-size:76px;line-height:1.06;margin:0 0 30px;letter-spacing:-1.5px}

.stage.accent{background:var(--azul);color:#fff;--ink:#fff;--soft:rgba(255,255,255,.8)} .stage.accent::before{background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.3px)}

@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.stage .shade.heavy{position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,243,236,.97) 0%,rgba(247,243,236,.9) 52%,rgba(247,243,236,.3) 100%)}

.stage.hasbg::before{display:none}
.stage.photo{color:#fff;--ink:#fff;--soft:rgba(255,255,255,.82)}
.stage.photo .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,22,40,.9) 0%,rgba(14,22,40,.7) 45%,rgba(14,22,40,.1) 100%)}
.stage.photo .foot{border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.8)} .stage.photo::before{display:none}
.stage.photo .content{right:auto;width:900px;display:flex;flex-direction:column;justify-content:flex-end;bottom:110px}
.stage.photo .quote{font-size:64px}
.stage.photo .kicker{background:var(--must);color:#14192B;box-shadow:3px 3px 0 #14192B}
.stage.photo.side{color:#14192B;--ink:#14192B;--soft:#4A5264} .stage.photo.side::before{display:block}
.stage.photo.side .bg{background-size:contain;background-position:right center;animation:none;left:auto;width:660px;right:72px;top:130px;bottom:90px;border-radius:6px;border:2.5px solid #14192B;box-shadow:10px 10px 0 var(--must)} .stage.photo.side .content{width:760px} .stage.photo.side .quote{font-size:54px}
.stage.photo.side .shade{background:none} .stage.photo.side .foot{border-color:#14192B;color:#4A5264}
.stage.illus .bg{animation:none} .stage.illus::before{display:none} .stage.illus .content{width:720px;right:auto;display:flex;flex-direction:column;justify-content:center} .stage.illus .quote{font-size:66px} .stage.illus h1.title{font-size:54px} .stage.illus .lead{font-size:32px} .stage.illus p{font-size:23px} .stage.illus .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,243,236,1) 0%,rgba(247,243,236,.9) 30%,rgba(247,243,236,.35) 42%,rgba(247,243,236,0) 50%)}
.stage.cover.hasimg .bg{animation:kb 60s ease-in-out infinite alternate} .stage.cover.hasimg .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,243,236,1) 0%,rgba(247,243,236,.96) 40%,rgba(247,243,236,.5) 52%,rgba(247,243,236,0) 62%)} .stage.cover.hasimg::before{display:none}
.stage.cover .content{display:flex;flex-direction:column;justify-content:center;top:0;bottom:0}
.stage.cover h1{font-family:"Playfair Display",serif;font-size:118px;color:var(--ink);margin:0 0 22px;line-height:.98;font-weight:900;letter-spacing:-4px}
.stage.cover h1 em{font-style:italic;color:var(--azul)}
.stage.cover .sub{display:inline-block;font-size:24px;color:#14192B;background:var(--must);padding:8px 18px;margin-bottom:16px;letter-spacing:1px;font-weight:700;transform:rotate(-1.5deg);box-shadow:4px 4px 0 var(--ink);align-self:flex-start} .stage.cover .by{font-size:20px;color:var(--soft);margin-bottom:0}
.stage.cover .logos{position:absolute;left:72px;bottom:60px;display:flex;gap:44px;align-items:center} .stage.cover .logos img{height:56px}
.stage.cover svg.motif{position:absolute;right:0;top:0;height:900px;width:900px}

.stage .qrbig{display:flex;gap:60px;align-items:flex-start} .stage .qrbig .qr{align-items:flex-start} .stage .qrbig canvas,.stage .qrbig img,.stage .qr canvas,.stage .qr img{border:14px solid #fff;outline:2.5px solid var(--ink);border-radius:4px;box-shadow:10px 10px 0 var(--must)}

.stage .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px} .stage .sgrid .card{display:flex;gap:18px;align-items:center;padding:20px 24px} .stage .sgrid .num{font-size:56px;margin:0} .stage .sgrid .names span{display:block;font-family:"Playfair Display",serif;font-size:28px;font-weight:700;line-height:1.25}
.stage .clockwrap{position:absolute;top:120px;right:72px} .stage .clock{font-family:"Playfair Display",serif;font-weight:900;font-size:64px;line-height:1;background:var(--ink);color:#fff;padding:14px 26px;border-radius:8px;box-shadow:6px 6px 0 var(--must);letter-spacing:1px} .stage .clock.fim{background:var(--coral)} .stage .clock.zero{animation:blink 1s step-start infinite} .stage .clock.idle{font-family:"Open Sans",sans-serif;font-weight:600;font-size:16px;background:transparent;color:var(--dim);box-shadow:none;padding:6px 0;letter-spacing:.5px} @keyframes blink{50%{opacity:.35}}

<body>

<script>
/* ======================= CONFIGURAÇÃO ======================= */
const CONFIG = {
  SUPABASE_URL: "https://dwzfqkteedcgfunjgonz.supabase.co",
  SUPABASE_ANON: "sb_publishable_r8RCaoMDQtHF9b7cU6hTUQ_b_wdkbc-",
  SESSAO: "plmj-2026",
  ADMIN_PIN: "2026"
};
/* ============================================================ */

/* ===================== SLIDES (ecrã integrado) =====================
   layout: cover | dark (default) | photo | accent
   live:   p1 | p1b | p2 | regua | placar | p3 | qr | eval
   momento: ao chegar a este slide, o telemóvel dos participantes abre este pulso
   rodada:  para live:regua
   passos: elementos com class="rv" data-s="n" aparecem no passo n (clique/seta)
*/
const EVAL_URL = "https://forms.office.com/pages/responsepage.aspx?id=4zEpxDNn5kGNQsSLozS7pAC51C8oVxxGmHFIdAiFiMBUQlg0UzNNV1hYTklYNzU2MllLQkVPNE05MCQlQCNjPTEkJUAjdD1n";
const rv=(n,html,cls)=>`<div class="rv ${cls||''}" data-s="${n}">${html}</div>`;
const SLIDES = [
 {id:"capa", layout:"cover", img:"img/r-via.jpg", size:"1600px 900px", pos:"230px 0", title:"Problem <em>Solving</em>", sub:"PLMJ · Plano de Formação 2026", by:"Rogério Oliveira · Nova SBE Executive Education"},

 {id:"qr", title:"Entre no pulso", live:"qr", momento:"p1",
  body:`<p class="lead">Anónimo. Sem nome. Sem login.</p><p>Dez perguntas, três minutos — antes de qualquer conteúdo.</p><p class="soft">Responda com o que faria de verdade, não com o ideal.</p>`},

 {id:"pergunta", layout:"accent", quote:"Se pudesse, eliminava o maior problema da sua vida?"},

 {id:"paraque", title:"Para que servem os problemas",
  body:`<div class="cols2 w40"><div class="stats">${rv(1,`<b style="font-size:120px;letter-spacing:-3px">2.398</b><p>adultos acompanhados durante anos. Quem tinha passado por <strong>alguma</strong> adversidade estava melhor — saúde mental, bem-estar, satisfação — do que quem não tinha passado por nenhuma. E do que quem tinha passado por demasiada.</p><span class="src">Seery, Holman &amp; Silver, 2010</span>`)}</div><div>${rv(2,`<p class="lead">Não é «sofrer faz crescer». É que uma vida sem problema nenhum não treina ninguém para o problema seguinte.</p>`)}</div></div>`},

 {id:"duplas1", kicker:"Sorteio", title:"Duplas", live:"sorteio", k:2},

 {id:"abertura", timer:6, layout:"illus", img:"img/r-abertura.jpg", size:"1600px 900px", pos:"160px 0", cw:600, kicker:"Abertura", title:"O seu maior <em>problema</em>",
  body:`<div class="steps vsm">${rv(1,`<div class="step"><b class="num">1</b><div><b class="blue">Em duplas, 6 minutos</b><br>Conte ao colega o maior problema que já viveu. O colega só escuta.</div></div>`)}${rv(2,`<div class="step"><b class="num">2</b><div><b class="blue">Depois, uma pergunta</b><br>Se pudesse, eliminava-o da sua vida?</div></div>`)}${rv(3,`<div class="step"><b class="num">3</b><div><b class="blue">Duas ou três duplas, 30 segundos</b><br>Não o problema — só a resposta, e porquê.</div></div>`)}</div>`},

 {id:"sofa", layout:"illus", img:"img/r-sofa.jpg", size:"1600px 900px", pos:"120px 0", cw:500, quote:"«O ser humano queria ser sofá. Mas ele é bicicleta.»"},

 {id:"dificuldade", title:"Dificuldade bem dosada",
  body:`<div class="cols2">${rv(1,`<div class="card dim"><h3>«Sofrer faz crescer»</h3><p>Popular. Medido antes e depois, o crescimento que as pessoas relatam não aparece.</p></div>`)}${rv(2,`<div class="card hi"><h3>Dificuldade moderada</h3><p>A dose certa de desequilíbrio: a que obriga a reequilibrar — e devolve a um ponto acima do anterior.</p></div>`)}</div>${rv(3,`<p class="lead blue">A bicicleta, não o acidente.</p>`)}`},

 {id:"res1", title:"O que a sala faz", live:"p1", after:rv(1,`<div class="leitura" id="leitura"></div>`)},

 {id:"cynefin", title:"Quatro tipos de problema <span class=\"dim\" style=\"font-size:.55em;font-weight:400\">(Cynefin)</span>",
  body:`<table class="cy">
<tr><th></th>${["Simples","Complicado","Complexo","Caótico"].map((t,i)=>`<th class="rv" data-s="${i+1}">${t}</th>`).join("")}</tr>
<tr><td class="lab">Exemplo</td>${["Uma lâmpada queimada","Uma apendicite","Criar um adolescente","Um avião sem motores sobre Nova Iorque"].map((t,i)=>`<td class="rv ex" data-s="${i+1}">${t}</td>`).join("")}</tr>
<tr><td class="lab">O que é</td>${["Regra conhecida, resposta conhecida","Há resposta certa — mas exige especialista e análise","Não há resposta certa antes de agir; só se percebe depois","Não há tempo de análise"].map((t,i)=>`<td class="rv" data-s="${i+1}">${t}</td>`).join("")}</tr>
<tr><td class="lab">Como se resolve</td>${["Consultar e aplicar","Analisar, decompor, decidir","Sondar com algo pequeno, observar, ajustar","Agir para estabilizar; depois pensar"].map((t,i)=>`<td class="rv b" data-s="${i+1}">${t}</td>`).join("")}</tr>
<tr class="rv" data-s="5"><td class="lab">Ferramenta</td><td>Checklist, procedimento</td><td><b>Método McKinsey</b>: decompor (MECE), árvore de questões, hipótese</td><td><b>Design Thinking / MVP</b>: protótipo pequeno, observar, iterar</td><td>Comando: estabilizar primeiro</td></tr>
</table><p class="small">Dave Snowden · <i>Cynefin</i>, galês: «o lugar das múltiplas pertenças» — a resposta depende do terreno onde se está</p>`},

 {id:"errar", timer:4, kicker:"Em duplas · 4 minutos", title:"E se errarmos o tipo?",
  body:`<p class="soft">Um exemplo da vida comum para cada cruzamento. Depois comparamos com os meus.</p><div class="cols2 tight"><div class="card"><h3>Simples tratado como complicado</h3>${rv(1,`<p>Contratar um consultor para a lâmpada.</p>`)}</div><div class="card"><h3>Complexo tratado como simples</h3>${rv(2,`<p>Um adolescente e uma regra só.</p>`)}</div><div class="card"><h3>Caótico tratado como simples</h3>${rv(3,`<p>O barco a afundar e alguém a ler o manual.</p>`)}</div><div class="card"><h3>Simples tratado como complexo</h3>${rv(4,`<p>Duas horas de reunião sobre a lâmpada.</p>`)}</div></div>`},

 {id:"fronteira", title:"O erro mais comum",
  body:`<p class="lead">Não é resolver mal. É tratar um problema complexo como se fosse complicado.</p><div class="cols2">${rv(1,`<div class="card dim"><h3>Na vida</h3><p>Insónia tratada como carro avariado: procurar o especialista que dá <i>a</i> resposta — em vez de mudar uma coisa pequena, dormir uma semana, observar, ajustar.</p></div>`)}${rv(2,`<div class="card hi"><h3>No escritório</h3><p>Procurar a lei que não existe, o precedente que não há, o parecer que fecha a questão.</p><p>Em problema complexo, o parecer que fecha é o parecer errado. O certo abre uma rota de teste.</p></div>`)}</div>${rv(3,`<p class="lead blue" style="font-size:31px;white-space:nowrap">Na fronteira ninguém chegou antes — é exatamente onde o cliente mais precisa de si.</p>`)}`},

 {id:"exercicio", timer:5, kicker:"Em duplas · 5 minutos", title:"Classifiquem dois problemas reais",
  body:`<div class="cols2"><div><p class="lead" style="font-size:30px">Dois problemas que viveram na PLMJ. Em que quadrante cai cada um?</p>${rv(1,`<p class="lead blue" style="margin-top:34px">Agora para a sala: dos problemas que discutiram, algum era complexo e foi tratado como complicado? Como?</p>`)}</div><div class="quad"><div>Simples</div><div>Complicado</div><div class="p">Complexo</div><div class="p">Caótico</div></div></div>`},

 {id:"casa", title:"Isto é da casa ou do ofício?", live:"p1b",
},

 {id:"klink1", layout:"photo", img:"img/klink-barco.jpg", pos:"center 40%", kicker:"1984 · Lüderitz, Namíbia → Praia da Espera, Bahia", quote:"O risco não foi eliminado.\nFoi desenhado.", cite:"Amyr Klink · Cem Dias Entre Céu e Mar",
  body:rv(1,`<p>Queria um barco que não virasse. Não existia sem ficar pesado e lento.</p><p>O engenheiro desenhou um barco <b>feito para virar e voltar sozinho</b>. Virou várias vezes. Voltou todas.</p>`)},

 {id:"klink2", layout:"photo", img:"img/klink-mapa.jpg", pos:"center 55%", side:true, kicker:"100 dias · 6.800 km · a remo", quote:"«Metade do que estava escrito no meu projeto não aconteceu. Ainda bem!»", cite:"Amyr Klink",
  body:`<p>Dois anos a preparar. O plano não era prever tudo — era aguentar o que não se previu.</p>`},

 {id:"klink3", layout:"photo", img:"img/klink-2026.jpg", pos:"center 30%", kicker:"2026 · quarenta e dois anos depois", quote:"O segundo a fazer a travessia. Klink foi recebê-lo ao cais.",
  body:`<p class="lead">O desenho continua a valer.</p>`},

 {id:"risco", layout:"illus", img:"img/r-risco.jpg", size:"1600px 900px", pos:"110px 0", cw:520, title:"Para onde vai o risco quando o advogado diz «não»",
  body:`<p class="lead blue">O risco não desaparece. Muda de mesa.</p><p>Sai da mesa de quem sabia. Cai na mesa de quem precisa — e que vai decidir sozinho, com menos informação do que o advogado tinha.</p>`},

 {id:"numeros", title:"Dois números e uma causa",
  body:`<div class="cols3 stats">${rv(1,`<div><b>25%</b><p>das decisões mais importantes do ano, entre 950 gestores, foram tomadas para proteger quem decidia — não a organização.</p><span class="src">Artinger, Artinger &amp; Gigerenzer, 2019</span></div>`)}${rv(2,`<div><b>4,5×</b><p>mais procura de outras opiniões pelo negócio quando o jurídico é conservador demais. O risco migra para quem sabe menos.</p><span class="src">Gartner · inquérito a 200+ advogados internos, 2020</span></div>`)}${rv(3,`<div><b class="pu">cultura</b><p>No mesmo estudo: quem via a cultura de erro da organização como negativa decidia mais defensivamente.</p><span class="src">a causa, não o carácter</span></div>`)}</div>${rv(4,`<p class="lead blue">A conclusão para a tarde não é «tenham coragem». É «tenham método».</p>`)}`},

 {id:"abre2", kicker:"Telemóvel", title:"Pulso 2", live:"abre", momento:"p2", body:`<p class="lead">Sete perguntas sobre a sua área — não sobre o escritório inteiro.</p><p>Três minutos. Anónimo. Responda com o que acontece, não com o que devia acontecer.</p>`},
 {id:"res2", title:"O que pesa quando se evita propor um caminho", live:"p2"},

 {id:"metodo", layout:"illus", img:"img/r-via.jpg", size:"1600px 900px", pos:"90px 0", cw:540, kicker:"Integrative Thinking · Roger Martin", title:"Terceira <em>Via</em>",
  body:`<div class="steps vsm">${rv(1,`<div class="step"><b class="num">1</b><div><b class="blue">Reenquadrar</b><br>do pedido ao interesse de cada lado; uma pergunta nova</div></div>`)}${rv(2,`<div class="step"><b class="num">2</b><div><b class="blue">Terceira via</b><br>três rotas — A, B, C — cada uma com o seu risco</div></div>`)}${rv(3,`<div class="step"><b class="num">3</b><div><b class="blue">Recomendar</b><br>uma proposta em quatro linhas, não «o que acham?»</div></div>`)}</div>${rv(4,`<p class="small">Primeiro fora do direito, com um exemplo meu. Depois vocês, em duplas. Depois três rondas com casos.</p>`)}`},

 {id:"passo1", num:1, title:"Reenquadrar — posição × interesse",
  body:`<div class="cols2 w40"><div><p class="lead">A posição é o que cada lado diz que quer. O interesse é o que o faz querer.</p><p class="small">Fisher &amp; Ury</p>${rv(3,`<p class="soft">Reenquadrar não garante uma terceira via. Garante que a pergunta deixa de ter só duas respostas.</p>`)}</div><div class="card">${rv(1,`<p><b class="blue">Posições</b><br>Eles: «vem no Natal.» · Eu: «vou à viagem de 22 a 28.»</p>`)}${rv(2,`<p><b class="blue">Interesses</b><br>Eles: presença, ritual, saber que a família ainda se junta. · Eu: a viagem — e não carregar culpa.</p>`)}${rv(3,`<p class="q">Como garantir o ritual da família <i>e</i> a viagem com os amigos no mesmo dezembro?</p>`)}</div></div>`},

 {id:"passo2", num:2, title:"Terceira via — três rotas, risco graduado",
  body:`<div class="cols3 routes big">${rv(1,`<div class="card dim"><b>A</b><p>Vou à viagem. Aviso que não vou no Natal.</p><p class="rk">Risco: mágoa; a ausência vira assunto.</p></div>`)}${rv(1,`<div class="card dim"><b>B</b><p>Cancelo a viagem.</p><p class="rk">Risco: perder a viagem e levar ressentimento para o Natal.</p></div>`)}${rv(2,`<div class="card hi"><b class="blue">C</b><p>Ceia da família a 20 ou 21, em casa deles, organizada por mim. Viagem. Réveillon com eles.</p><p class="rk">Risco: «não é a mesma coisa». Mitigo: organizo eu a ceia, não só peço a data.</p></div>`)}</div>`},

 {id:"construirC", num:2, title:"Como construir o C",
  body:`<div class="cols3 xl">${rv(1,`<div class="card hi"><h3>Três formas</h3><p>Um benefício de cada lado, e larga-se o resto.</p><p>Tudo de A + o essencial de B.</p><p>Partir o problema em dois: Natal e réveillon — viagem num, família no outro.</p><p class="small">Riel &amp; Martin</p></div>`)}${rv(2,`<div class="card"><h3>Teste</h3><p>O que cada lado queria de verdade continua inteiro?</p><p class="small">Meio-termo: metade da viagem, metade da presença no Natal. Perda dos dois lados.</p></div>`)}${rv(3,`<div class="card"><h3>Travão</h3><p>Antes de contornar uma regra, perceber o que ela protege.</p><p class="small">«Natal é a 25» protege a família junta, não a data — por isso o dia 21 funciona. Se a regra protege algo essencial — compliance, uma proibição legal — o C contorna o obstáculo, nunca a proteção. E às vezes não há C.</p></div>`)}</div>`},

 {id:"passo3", num:3, title:"Recomendar — comunicar para o outro decidir",

/* ---------- infra ---------- */
const $ = s=>document.querySelector(s);
const app = $("#app");
const H = ()=>({apikey:CONFIG.SUPABASE_ANON,Authorization:"Bearer "+CONFIG.SUPABASE_ANON,"Content-Type":"application/json"});
async function sb(path,opt={}){
  const r = await fetch(CONFIG.SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{...H(),...(opt.headers||{})}});
  if(!r.ok) throw new Error(r.status+" "+await r.text());
  const t = await r.text(); return t?JSON.parse(t):null;
}
const getEstado = ()=>sb(`plmj_estado?sessao=eq.${CONFIG.SESSAO}&select=*`).then(r=>r[0]);
const setEstado = (patch)=>sb(`plmj_estado?sessao=eq.${CONFIG.SESSAO}`,{method:"PATCH",body:JSON.stringify({...patch,atualizado:new Date().toISOString()}),headers:{Prefer:"return=minimal"}});
const getRespostas = (momento)=>sb(`plmj_respostas?sessao=eq.${CONFIG.SESSAO}${momento?`&momento=eq.${momento}`:""}&select=dispositivo,momento,item,valor,criado&limit=5000`);
async function upsert(rows){ return sb(`plmj_respostas?on_conflict=sessao,dispositivo,momento,item`,{method:"POST",body:JSON.stringify(rows),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}}); }
function devId(){ let id=null; try{id=localStorage.getItem("plmj_dev");}catch(e){} if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36); try{localStorage.setItem("plmj_dev",id);}catch(e){}} return id; }
const ANIMAIS=["Golfinho","Leão","Tigre","Falcão","Lobo","Raposa","Coruja","Urso","Pantera","Águia","Cavalo","Tubarão","Gato","Lince","Jaguar","Búfalo","Pinguim","Gaivota","Cegonha","Baleia","Orca","Foca","Lontra","Castor","Veado","Garça","Pato","Tartaruga","Camaleão","Andorinha","Pardal","Melro","Corvo","Grilo","Formiga","Abelha","Borboleta","Libélula","Cisne","Flamingo"];
function cracha(){ let c=null; try{c=localStorage.getItem("plmj_cracha");}catch(e){} if(!c){ const id=devId(); let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; c=ANIMAIS[h%ANIMAIS.length]+" "+(10+((h>>>7)%90)); try{localStorage.setItem("plmj_cracha",c);}catch(e){} } return c; }
const getExtras = ()=>sb(`plmj_respostas?sessao=eq.${CONFIG.SESSAO}&momento=in.(presenca,grupos)&select=dispositivo,momento,item,valor,criado&limit=2000`);
function presentes(rows){ const m={}, vivo={}; const lim=Date.now()-10*60*1000; rows.filter(r=>r.momento==="presenca"&&r.item==="visto").forEach(r=>{ if(Date.parse(r.valor)>lim) vivo[r.dispositivo]=1; }); rows.filter(r=>r.momento==="presenca"&&r.item==="cracha"&&vivo[r.dispositivo]).forEach(r=>m[r.dispositivo]=r.valor); return m; }
function grupos(rows,item){ const r=rows.find(x=>x.momento==="grupos"&&x.item===item); try{ return r?JSON.parse(r.valor):null; }catch(e){ return null; } }
function agrupar(devs,k){ const a=[...devs]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } const g=[]; for(let i=0;i<a.length;i+=k) g.push(a.slice(i,i+k)); if(g.length>1&&g[g.length-1].length===1){ const last=g.pop(); g[g.length-1].push(...last); } return g; }
window.sortear=async(k)=>{ const rows=await getExtras(); const devs=Object.keys(presentes(rows)); const g=agrupar(devs,k); await upsert([{sessao:CONFIG.SESSAO,dispositivo:"SORTEIO",momento:"grupos",item:k===2?"duplas":"trios",valor:JSON.stringify(g)}]); lastSig=""; tick(); };
function timerFim(rows){ const r=rows.find(x=>x.momento==="timer"&&x.item==="fim"); return r&&r.valor?Date.parse(r.valor):0; }
window.relogio=async(min)=>{ const fim=timerFim(lastRows); const v=(fim&&fim>Date.now())?"":new Date(Date.now()+min*60000).toISOString(); await upsert([{sessao:CONFIG.SESSAO,dispositivo:"TIMER",momento:"timer",item:"fim",valor:v}]); lastSig=""; tick(); };
let clockIv=null;
function pintarRelogio(){ const el=document.getElementById("clock"); if(!el) return; const fim=+el.dataset.fim; const left=Math.max(0,Math.round((fim-Date.now())/1000)); const m=String(Math.floor(left/60)).padStart(2,"0"), s=String(left%60).padStart(2,"0"); el.textContent=m+":"+s; el.classList.toggle("zero",left===0); el.classList.toggle("fim",left<=30); }
function pitchPairs(N,r){ if(N<2) return []; if(r===3) return null; if(N===2) return [[1,2],[2,1]]; const k=r===1?1:2; return Array.from({length:N},(_,i)=>[i+1,((i+k)%N)+1]); }
function pitchHtml(rows,r){ const g=grupos(rows,"trios"); const N=g?g.length:0; const label=x=>x.map(([a,b])=>`<span><b>${a}</b>→${b}</span>`).join(" · ");
  if(!N) return `<div class="pitch"><b>Quem apresenta a quem</b> — fica definido depois do sorteio dos trios.<br><span class="soft">Ronda 1: cada trio ao seguinte · Ronda 2: ao segundo seguinte · Ronda 3: todos à sala.</span></div>`;
  if(r){ const p=pitchPairs(N,r); return `<div class="pitch"><b>Quem apresenta a quem:</b> ${p?label(p):"todos os trios à sala inteira — os outros trios avaliam"}</div>`; }
  return `<div class="pitch"><div><b>Ronda 1</b> ${label(pitchPairs(N,1))}</div><div><b>Ronda 2</b> ${label(pitchPairs(N,2))}</div><div><b>Ronda 3</b> todos à sala — os outros trios avaliam</div></div>`; }
function meuGrupo(rows){ const me=devId(); const p=presentes(rows); const out={}; for(const item of ["duplas","trios"]){ const g=grupos(rows,item); if(!g) continue; const i=g.findIndex(x=>x.includes(me)); if(i>=0) out[item]={n:i+1,outros:g[i].filter(d=>d!==me).map(d=>p[d]||"?")}; } return out; }

function renderEcra(est,rows){
  const {n:raw,p}=decode(est.slide); const n=Math.min(Math.max(1,raw),SLIDES.length); const s=SLIDES[n-1]; const ms=maxStep(s);
  const PRO=document.body.classList.contains("t-pro"); const darkS=(s.layout==="photo"&&(!s.side||PRO))||s.layout==="accent"||(PRO&&s.layout==="illus"); const logoN=`<img class="chrome-logo" src="${darkS?ASSETS.novaWhite:ASSETS.novaColor}" alt="">`, logoP=`<img class="chrome-plmj" src="${darkS?ASSETS.plmjWhite:ASSETS.plmjSq}" alt="">`;
  const foot=`<div class="foot"><span>Problem Solving · PLMJ · Nova SBE Executive Education</span><span>${n} / ${SLIDES.length}</span></div>`;
  const nav=`<div class="nav"><button onclick="stepBack()">‹</button><button onclick="stepFwd()">›</button></div>`;
  const pg=`<div class="pg"><i style="width:${(n-1)/(SLIDES.length-1)*100}%"></i></div>`;
  let inner="";
  if(s.layout==="cover"){
    inner=`<div class="stage cover ${s.img?'hasimg':''}">${document.body.classList.contains("t-pro")?MOTIF.replace(/#14192B/g,"rgba(255,255,255,.55)").replace(/rgba\(20,25,43,\.12\)/g,"rgba(255,255,255,.12)").replace(/#FF5A36/g,"#009CD1").replace(/#F2B705/g,"#7CD4F2"):""}${s.img?`<div class="bg" style="background-image:url(${s.img});background-position:${s.pos||'right center'};background-size:${s.size||'cover'}"></div><div class="shade"></div>`:MOTIF}<div class="content"><h1>${s.title}</h1><div class="sub">${esc(s.sub)}</div><div class="by">${esc(s.by)}</div></div><div class="logos"><img src="${document.body.classList.contains("t-pro")?ASSETS.novaWhite:ASSETS.novaColor}" alt=""><img src="${document.body.classList.contains("t-pro")?ASSETS.plmjWhite:ASSETS.plmjSq}" alt=""></div>${nav}</div>`;
  } else if(s.layout==="illus"){
    inner=`<div class="stage illus"><div class="bg" style="background-image:url(${s.img});background-position:${s.pos||'center'};${s.size?`background-size:${s.size};`:''}"></div><div class="shade"></div>${logoN}${logoP}<div class="content" style="${s.cw?`width:${s.cw}px`:''}">${s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:""}${s.title?`<h1 class="title">${s.title}</h1>`:""}${s.quote?`<div class="quote">${esc(s.quote).replace(/\n/g,"<br>")}</div>`:""}${s.cite?`<div class="cite">${esc(s.cite)}</div>`:""}${s.body||""}</div>${foot}${nav}${pg}</div>`;
  } else if(s.layout==="photo"){
    inner=`<div class="stage photo ${s.side?'side':''}"><div class="bg" style="background-image:url(${s.img});background-position:${s.pos||'center'}"></div><div class="shade"></div>${logoN}${logoP}<div class="content">${s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:""}<div class="quote">${esc(s.quote).replace(/\n/g,"<br>")}</div>${s.cite?`<div class="cite">${esc(s.cite)}</div>`:""}${s.body||""}</div>${foot}${nav}${pg}</div>`;
  } else if(s.quote){
    const live=s.live?liveContent(s.live,est,rows,s):"";
    const bgq=s.bg?`<div class="bg" style="background-image:url(${s.bg});background-position:${s.pos||'center'}"></div><div class="shade ${s.layout==='accent'?'accentbg':'heavy'}"></div>`:"";
    inner=`<div class="stage ${s.layout||''} ${s.bg?'hasbg':''}">${bgq}${logoN}${logoP}<div class="content" style="${s.live?'display:grid;grid-template-columns:3fr 2fr;gap:60px;align-items:center':''}"><div>${s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:""}<div class="quote">${esc(s.quote).replace(/\n/g,"<br>")}</div>${s.cite?`<div class="cite">${esc(s.cite)}</div>`:""}${s.body||""}</div>${s.live?`<div>${live}</div>`:""}</div>${foot}${nav}${pg}</div>`;
  } else {
    const kick=s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:"";
    const tt=/<span/.test(s.title||"")?s.title:esc(s.title); const title=s.num?`<div class="numtitle"><span class="num">${s.num}</span><h1 class="title" style="margin:0">${tt}</h1></div>`:`${kick}<h1 class="title">${tt}</h1>`;
    let body=s.body||"";
    if(s.live==="regua"){ body=body.replace('<div class="livebox" id="live"></div>',`<div class="livebox">${liveContent("regua",est,rows,s)}</div>`); }
    else if(s.live){ body=liveContent(s.live,est,rows,s); }
    body=body.replace('<div class="pitchline"></div>',pitchHtml(rows,s.rodada||0));
    const devs=s.live&&["p1","p1b","p2","p3"].includes(s.live)?new Set(rows.filter(r=>r.momento===(s.live==="p1b"?"p1":s.live)).map(r=>r.dispositivo)).size:null;
    const after=s.after?`<div class="after">${s.after}</div>`:"";
    const bg=s.bg?`<div class="bg" style="background-image:url(${s.bg});background-position:${s.pos||'center'}"></div><div class="shade heavy"></div>`:"";
    inner=`<div class="stage ${s.layout||''} ${s.bg?'hasbg':''}">${bg}${logoN}${logoP}${devs!==null?`<div class="count"><b>${devs}</b>respostas</div>`:""}<div class="content">${title}${body}${after}</div>${foot}${nav}${pg}</div>`;
  }
  const fim=timerFim(rows); if(s.timer){ const st=document.createElement("div"); st.className="clockwrap"; st.innerHTML=fim&&fim>Date.now()-5000?`<div class="clock" id="clock" data-fim="${fim}">--:--</div>`:`<div class="clock idle">${s.timer} min · <b>T</b> para arrancar</div>`; inner=inner.replace('<div class="foot">',st.outerHTML+'<div class="foot">'); }
  app.innerHTML=inner; const le=document.getElementById("leitura"); if(le){ const L=leituras(rows); le.innerHTML=L.length?`<div class="small dim" style="letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:6px">Leitura</div>`+L.map(x=>`<p class="lead blue" style="font-size:28px;margin-bottom:6px">${esc(x)}</p>`).join(""):""; } clearInterval(clockIv); if(document.getElementById("clock")){ pintarRelogio(); clockIv=setInterval(pintarRelogio,250); }
  // passos: já revelados aparecem sem animação; o passo atual anima
  const key=n+"|"+p; const same=(key===lastSlideN); lastSlideN=key;
  document.querySelectorAll(".stage .rv").forEach(el=>{ const k=+el.dataset.s; if(k<p||(same&&k<=p)) el.classList.add("on"); });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ document.querySelectorAll(".stage .rv").forEach(el=>{ if(+el.dataset.s<=p) el.classList.add("on"); }); }));
  if(s.live==="sorteio"){ const item=s.k===2?"duplas":"trios"; if(!grupos(rows,item)&&Object.keys(presentes(rows)).length&&!window.__autoSort){ window.__autoSort=item; sortear(s.k).then(()=>{window.__autoSort=null;}); } }
  if(s.live==="qr"||s.live==="eval"){ const el=$("#qr"); if(el){ try{ if(typeof QRCode==="undefined") throw new Error("qr lib"); new QRCode(el,{text:s.live==="qr"?PURL():EVAL_URL,width:s.live==="qr"?420:300,height:s.live==="qr"?420:300,colorDark:"#231F20",correctLevel:QRCode.CorrectLevel.L}); }catch(e){ el.innerHTML=`<div style="font-size:22px;word-break:break-all;max-width:420px">${esc(s.live==="qr"?PURL():EVAL_URL)}</div>`; } } }
  fitStage();
}
function fitStage(){ const st=document.querySelector(".stage"); if(!st) return; const k=Math.min(window.innerWidth/1600,window.innerHeight/900); st.style.transform=`scale(${k})`; st.style.left=((window.innerWidth-1600*k)/2)+"px"; st.style.top=((window.innerHeight-900*k)/2)+"px"; }
window.addEventListener("resize",fitStage);
let localUntil=0, lastRows=[];
window.goSlide=(n,p=0)=>{ n=Math.min(Math.max(1,n),SLIDES.length); const s=SLIDES[n-1]; const patch={slide:encode(n,p)}; if(s.momento) patch.momento_ativo=s.momento; if(s.rodada) patch.rodada=s.rodada;
  curEst={...curEst,...patch}; localUntil=Date.now()+2500; lastSig="";
  if(mode()==="ecra") renderEcra(curEst,lastRows); else if(mode()==="admin") renderAdmin(curEst,lastRows);
  pendingPatch={...(pendingPatch||{}),...patch}; pendingSaves++; saveChain=saveChain.then(async()=>{ const p=pendingPatch; if(p){ pendingPatch=null; await setEstado(p); } }).catch(e=>console.error(e)).then(()=>{ pendingSaves=Math.max(0,pendingSaves-1); localUntil=Date.now()+3000; }); };
let pendingSaves=0;
let pendingPatch=null, saveChain=Promise.resolve();
window.stepFwd=()=>{ const {n,p}=decode(curEst.slide); const s=SLIDES[Math.min(Math.max(1,n),SLIDES.length)-1]; if(p<maxStep(s)) goSlide(n,p+1); else goSlide(n+1,0); };
window.stepBack=()=>{ const {n,p}=decode(curEst.slide); if(p>0) goSlide(n,p-1); else goSlide(n-1,0); };
document.addEventListener("keydown",async e=>{ if(mode()!=="ecra") return; if(["ArrowRight","PageDown"," ","Enter","ArrowDown"].includes(e.key)){ e.preventDefault(); stepFwd();} if(["ArrowLeft","PageUp","Backspace","ArrowUp"].includes(e.key)){ e.preventDefault(); stepBack();} if(e.key==="f"||e.key==="F"){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); } if(e.key==="s"||e.key==="S"){ const {n}=decode(curEst.slide); const s=SLIDES[n-1]; if(s&&s.live==="sorteio") sortear(s.k); } if(e.key==="t"||e.key==="T"){ const {n}=decode(curEst.slide); const s=SLIDES[n-1]; if(s&&s.timer) relogio(s.timer); } });

/* ---------- tela (só resultados, reserva) ---------- */
function renderTela(est,rows){
  const m=est.momento_ativo; let h=`<div class="top"><div><div class="brand" style="font-size:1.6rem">Pulso · PLMJ</div></div><div class="sub">${esc((MOMENTOS[m]||{}).titulo||"")}</div></div>`;
  if(m==="p1") h+=`<div class="grid">${liveContent("p1",est,rows,{}).replace(/lpanel/g,"panel")}</div>`;
  else if(m==="p2") h+=`<div class="grid">${liveContent("p2",est,rows,{}).replace(/lpanel/g,"panel")}</div>`;
  else if(m==="regua") h+=`<div class="grid">${[1,2,3].filter(r=>r<=est.rodada).map(r=>reguaHtml(rows,r)).join("")}${placarHtml(rows,est.rodada)}</div>`;
  else if(m==="p3") h+=`<div class="grid">${liveContent("p3",est,rows,{}).replace(/lpanel/g,"panel")}</div>`;
  else h+=`<div class="panel center"><h1>${esc((MOMENTOS[m]||{}).titulo||"")}</h1></div>`;
  app.innerHTML=h;
}

/* ---------- admin ---------- */
let adminOK=false;
function renderAdmin(est,rows){
  if(!adminOK){ app.innerHTML=header("controlo")+`<div class="card"><h2>PIN</h2><input type="text" id="pin" inputmode="numeric"><button class="primary" onclick="if($('#pin').value===CONFIG.ADMIN_PIN){adminOK=true;lastSig='';tick();}else alert('PIN errado')">Entrar</button></div>`; return; }
  const {n,p}=decode(est.slide); const s=SLIDES[Math.min(Math.max(1,n),SLIDES.length)-1]; const mx=maxStep(s);
  let h=header("controlo")+`<div class="adminbar"><button class="big" onclick="stepBack()">‹</button><div style="flex:1;text-align:center"><b>${n}/${SLIDES.length}</b>${mx?` <span class="muted">· passo ${p}/${mx}</span>`:""}<br>${esc(s.title||s.quote||s.id)}</div><button class="big" onclick="stepFwd()">›</button></div>`;
  const ms=["espera","p1","p2","regua","p3","fim"];
  h+=`<p class="muted">Pulso aberto nos telemóveis: <b>${esc(MOMENTOS[est.momento_ativo].titulo)}</b>${est.momento_ativo==="regua"?" · ronda "+est.rodada:""} — muda sozinho ao avançar; aqui pode forçar:</p><div class="adminbar">${ms.map(x=>`<button class="${est.momento_ativo===x?'on':''}" onclick="go('${x}')">${esc(MOMENTOS[x].titulo)}</button>`).join("")}</div>`;
  h+=`<div class="adminbar"><span>Ronda:</span>${[1,2,3].map(r=>`<button class="${est.rodada===r?'on':''}" onclick="ronda(${r})">${r}</button>`).join("")}</div>`;
  const by={}; rows.forEach(r=>{by[r.momento]=by[r.momento]||new Set(); by[r.momento].add(r.dispositivo);});
  h+=`<div class="card"><table class="t"><tr><th>Momento</th><th>Dispositivos</th></tr>${["presenca","p1","p2","regua","p3","email"].map(x=>`<tr><td>${x}</td><td>${by[x]?by[x].size:0}</td></tr>`).join("")}</table></div>`;
  h+=`<div class="adminbar"><button onclick="sortear(2)">Sortear duplas</button><button onclick="sortear(3)">Sortear trios</button>${s.timer?`<button class="${timerFim(rows)>Date.now()?'on':''}" onclick="relogio(${s.timer})">${timerFim(rows)>Date.now()?'Parar relógio':'Relógio '+s.timer+' min'}</button>`:""}</div>`;
  h+=`<div class="adminbar"><button onclick="goSlide(${n+1},0)">Saltar para o slide seguinte</button><button onclick="exportar()">Exportar CSV</button><button onclick="window.open(location.pathname+'#ecra','_blank')">Abrir ecrã</button></div>`;
  h+=`<h2>Slides</h2><div class="slidelist">${SLIDES.map((x,i)=>`<button class="${i+1===n?'on':''}" onclick="goSlide(${i+1})"><span class="k">${i+1}</span>${esc(x.title||x.quote||x.id)}${x.live?' <span class="tag">'+x.live+'</span>':''}</button>`).join("")}</div>`;
  app.innerHTML=h;
}
window.go=async m=>{ await setEstado({momento_ativo:m}); lastSig=""; tick(); };
window.ronda=async r=>{ await setEstado({rodada:r,momento_ativo:"regua"}); lastSig=""; tick(); };
window.exportar=async()=>{
  const rows=await getRespostas(); const head="dispositivo,momento,item,valor,criado\n";
  const csv=head+rows.map(r=>[r.dispositivo,r.momento,r.item,r.valor,r.criado].map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download=`pulso-plmj-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
};

/* ---------- loop ---------- */
const mode = ()=>({"#tela":"tela","#admin":"admin","#ecra":"ecra"})[location.hash]||"p";
let lastSig="", curEst={slide:1};
async function tick(){
  try{
    let est=await getEstado(); if(!est) throw new Error("estado não encontrado");
    if(pendingSaves>0||Date.now()<localUntil){ est={...est,slide:curEst.slide,momento_ativo:curEst.momento_ativo,rodada:curEst.rodada}; }
    curEst=est;
    const md=mode();
    if(md==="p"){ registarPresenca(); let ex=[]; try{ ex=await getExtras(); }catch(e){} const gsig=JSON.stringify(ex.filter(r=>r.momento==="grupos").map(r=>r.valor)); const k=est.momento_ativo+"|"+est.rodada+"|"+gsig; if(k!==pState.momento){pState.momento=k; pExtras=ex; renderParticipante(est);} return; }
    const rows=await getRespostas(); lastRows=rows;
    const sig=JSON.stringify([md,est.momento_ativo,est.rodada,est.slide,rows.length,adminOK,timerFim(rows)]);
    if(sig!==lastSig){ lastSig=sig; md==="ecra"?renderEcra(est,rows):md==="tela"?renderTela(est,rows):renderAdmin(est,rows); }
  }catch(e){ app.innerHTML=header()+`<div class="err">Erro de ligação: ${esc(e.message)}</div>`; console.error(e); }
}
function tema(){ const u=new URLSearchParams(location.search); let tm=u.get("tema"); if(tm){ try{localStorage.setItem("plmj_tema",tm);}catch(e){} } else { try{tm=localStorage.getItem("plmj_tema");}catch(e){} } return tm||"cartaz"; }
function applyMode(){ const md=mode(); document.body.classList.toggle("t-pro",tema()==="pro"); document.body.classList.toggle("tela",md==="tela"); document.body.classList.toggle("ecra",md==="ecra"); lastSig=""; pState.momento=null; }
applyMode(); tick();
window.addEventListener("hashchange",()=>{applyMode(); tick();});
setInterval(tick, 3000);
</script>
