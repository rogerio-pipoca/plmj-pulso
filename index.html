<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulso PLMJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#009CD1;--roxo:#572068;--ink:#231F20;--bg:#ffffff;--card:#f5f7f9;--line:#dfe5ea;--muted:#6b7680;--ok:#1a9c6b}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Open Sans",Arial,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:1.9rem;color:var(--roxo)} h2{font-size:1.35rem;color:var(--roxo)} h3{font-size:1.1rem;color:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 18px;border-bottom:3px solid var(--azul);margin-bottom:22px}
.top .brand{font-family:"Playfair Display",serif;font-weight:900;font-size:1.1rem;color:var(--azul)}
.top .sub{font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.q{margin:0 0 20px}
.q .t{font-weight:600;margin:0 0 10px}
.q .n{display:inline-block;font-family:"Playfair Display",serif;color:var(--azul);font-weight:900;margin-right:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 8px;font:inherit;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--azul);background:#e8f6fb;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .opt{flex:1 1 auto;width:auto;min-width:56px;text-align:center}
textarea,input[type=text]{width:100%;font:inherit;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button.primary{display:block;width:100%;background:var(--azul);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:10px}
button.primary:disabled{opacity:.45;cursor:default}
button.ghost{background:#fff;color:var(--roxo);border:1.5px solid var(--roxo);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.muted{color:var(--muted);font-size:.9rem}
.center{text-align:center}
.big{font-family:"Playfair Display",serif;font-size:2.2rem;color:var(--roxo);line-height:1.1}
.err{background:#fdecec;border:1px solid #f3b4b4;color:#8a1c1c;padding:12px;border-radius:10px;margin-bottom:14px}
.ok{color:var(--ok);font-weight:600}
/* screen */
.tela .wrap{max-width:1500px;padding:28px 40px}
.tela h1{font-size:2.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.panel h3{font-size:1.15rem;color:var(--roxo);margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(140px,2.2fr) 5fr 44px;align-items:center;gap:10px;margin:7px 0;font-size:1rem}
.bar .lab{color:var(--ink)} .bar .trk{background:#eef2f5;border-radius:6px;height:22px;overflow:hidden}
.bar .fil{height:100%;background:var(--azul);border-radius:6px;transition:width .6s}
.bar.alt .fil{background:var(--roxo)} .bar .val{text-align:right;font-weight:700;color:var(--roxo)}
.kpi{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 18px}
.kpi div{font-size:.95rem;color:var(--muted)} .kpi b{display:block;font-family:"Playfair Display",serif;font-size:2rem;color:var(--azul);line-height:1}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr img,.qr canvas{border:10px solid #fff;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.verb{background:#f5f7f9;border-left:4px solid var(--roxo);padding:10px 14px;margin:8px 0;border-radius:6px;font-size:1.05rem}
.tag{display:inline-block;background:var(--roxo);color:#fff;font-size:.75rem;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;letter-spacing:.3px}
.adminbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.adminbar button{font:inherit;padding:9px 14px;border-radius:10px;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font-weight:600;cursor:pointer}
.adminbar button.on{background:var(--azul);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:.95rem} table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left} table.t th{color:var(--roxo)}
@media (max-width:480px){html,body{font-size:16px}.big{font-size:1.8rem}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ======================= CONFIGURAÇÃO ======================= */
const CONFIG = {
  SUPABASE_URL: "https://dwzfqkteedcgfunjgonz.supabase.co",
  SUPABASE_ANON: "sb_publishable_r8RCaoMDQtHF9b7cU6hTUQ_b_wdkbc-",
  SESSAO: "plmj-2026",
  ADMIN_PIN: "2026"
};
/* ============================================================ */

const MOMENTOS = {
  espera:{titulo:"Bem-vindo/a",desc:"Aguarde. A primeira ronda abre em instantes."},
  p1:{titulo:"Pulso 1",desc:"Nove perguntas rápidas. Anónimo. Responda com o que faria de verdade, não com o ideal."},
  p2:{titulo:"Pulso 2",desc:"Sete perguntas sobre a sua área — não sobre o escritório inteiro."},
  regua:{titulo:"Régua da ronda",desc:"O vosso trio avalia o pitch que acabou de ouvir. Uma resposta por trio."},
  p3:{titulo:"Pulso 3",desc:"Para fechar. Seis itens."},
  fim:{titulo:"Obrigado",desc:"A sessão terminou. Avalie a formação no QR do último slide."}
};

const Q = {
 p1:[
  {id:"F1",t:"Há quanto tempo está na PLMJ?",o:["Até 1 ano","1–3 anos","3–5 anos","Mais de 5 anos"]},
  {id:"F2",t:"Na última semana, com quem trocou mais mensagens de trabalho?",o:["Cliente","Sócio ou sénior","Colegas do meu nível","Equipa de apoio"]},
  {id:"S1",t:"Um sócio encaminha-lhe um e-mail de cliente com a instrução «vê isto e prepara uma resposta». O cliente pede uma coisa específica, mas pelo contexto percebe que o que ele quer alcançar talvez se resolvesse de outra forma. O que faz?",o:["Preparo a resposta ao que foi pedido, bem fundamentada","Preparo a resposta ao que foi pedido e acrescento uma nota sobre a outra forma","Antes de preparar, pergunto ao sócio qual é o objetivo do cliente","Preparo duas versões e deixo o sócio escolher"]},
  {id:"S2",t:"Numa revisão de contrato, identifica uma cláusula que no futuro pode criar um problema ao cliente — mas não é o ponto que lhe pediram para rever. O que faz?",o:["Revejo o que foi pedido; o resto não é o âmbito","Menciono de passagem na entrega","Escrevo um parágrafo separado com o risco e o que faria","Falo com quem pediu antes de entregar"]},
  {id:"S3",t:"Um cliente pergunta se pode fazer determinada operação. A sua análise aponta um obstáculo legal relevante. Como responde?",o:["Com a análise do obstáculo e a conclusão de que não é recomendável","Com a análise do obstáculo e a sugestão de que se avalie outra estrutura","Com uma estrutura alternativa já desenhada, com os riscos dela","Peço mais tempo para estudar alternativas antes de responder"]},
  {id:"C1",t:"No último processo ou dossiê em que trabalhou, conseguiria dizer numa frase o que o cliente queria alcançar do ponto de vista do negócio dele?",o:["Sim, com facilidade","Em parte","Não","Nunca me foi dito"]},
  {id:"C2",t:"Essa informação chegou até si…",o:["Pelo próprio cliente","Pelo sócio ou sénior","Deduzi dos documentos","Não chegou"]},
  {id:"M1",t:"Pense no último documento de análise que entregou (memo, e-mail longo, parecer). Qual era a maior parte dele?",o:["Contexto e factos","Análise jurídica","Opções possíveis","Recomendação"]},
  {id:"M1b",t:"E a recomendação ocupava…",o:["Nada — não havia","Uma frase","Um parágrafo","A maior parte"]},
  {id:"M2",t:"O que fez quem o recebeu, até onde sabe?",o:["Decidiu com base nele","Fez uma pergunta de seguimento","Pediu «a versão curta»","Encaminhou a outra pessoa","Não sei"]}
 ],
 p2:[
  {id:"E1",t:"Na sua área, qual seria pior para quem assinou?",o:["Um parecer conservador demais — e o cliente perdeu uma oportunidade","Um parecer permissivo demais — e o cliente correu um risco que se concretizou","Seriam igualmente graves"]},
  {id:"E2",t:"Da última vez que algo correu mal num assunto da sua área, a primeira conversa foi sobre…",o:["Quem tinha assinado","O que se aprende","Como evitar na próxima","Não houve conversa","Não me lembro de um caso"]},
  {id:"E3",t:"Se um colega do seu nível levasse ao sócio uma estrutura alternativa para um assunto, o mais provável na sua área seria…",o:["O sócio adotar","Pedir para pôr por escrito e depois ver","Agradecer e seguir o plano original","Depende muito do sócio"]},
  {id:"T1",t:"No último pedido urgente que recebeu, quantas horas havia entre o pedido e o prazo?",o:["Menos de 4","4 a 24","1 a 3 dias","Mais de 3 dias"]},
  {id:"T2",t:"E quanto desse tempo gastou a perceber o que o cliente queria alcançar, antes de começar a escrever?",o:["Nenhum","Menos de 10%","10 a 30%","Mais de 30%"]},
  {id:"P1",t:"Dos colegas do seu nível na PLMJ, que proporção costuma levar uma alternativa junto com o obstáculo, quando há obstáculo?",o:["Quase ninguém","Menos de metade","Cerca de metade","Mais de metade","Quase todos"]},
  {id:"P2",t:"E dos sócios e seniores com quem trabalha, que proporção quer receber alternativas em vez de só a conclusão?",o:["Quase ninguém","Menos de metade","Cerca de metade","Mais de metade","Quase todos"]}
 ],
 regua:[
  {id:"trio",t:"O vosso trio é o número…",o:["1","2","3","4","5","6"],row:true},
  {id:"alvo",t:"Estão a avaliar o trio número…",o:["1","2","3","4","5","6"],row:true},
  {id:"q1",t:"A recomendação veio antes da análise?",o:["Sim","Não"],row:true},
  {id:"q2",t:"A terceira rota preserva o que cada lado queria?",o:["Sim","Não"],row:true},
  {id:"q3",t:"O risco foi dito, com o que se faz para o reduzir?",o:["Sim","Não"],row:true},
  {id:"q4",t:"Ficou claro o que decidir e até quando?",o:["Sim","Não"],row:true}
 ],
 p3:[
  {id:"A1",t:"Comparado com os colegas do seu nível, vê-se como alguém que leva alternativas junto com o obstáculo…",o:["Muito menos","Menos","Igual","Mais","Muito mais"]},
  {id:"A2",t:"Quando identifica algo fora do âmbito que merece atenção, costuma levantá-lo…",o:["Raramente","Às vezes","Quase sempre"]},
  {id:"A3",t:"Quem recebe os seus documentos consegue decidir só com eles…",o:["Raramente","Às vezes","Quase sempre"]},
  {id:"O1",t:"Descreva uma situação recente em que tinha uma alternativa em mente e não a apresentou. O que teria sido preciso para a apresentar?",text:true},
  {id:"O2",t:"O que precisaria de saber sobre o cliente, e normalmente não sabe, para propor melhor?",text:true},
  {id:"X1",t:"Na próxima semana, em que situação concreta tenciona usar o que fez hoje? (opcional)",text:true,opt:true},
  {id:"X2",t:"Confiança de que isso vai acontecer",o:["1","2","3","4","5"],row:true}
 ]
};

/* ---------- infra ---------- */
const $ = s=>document.querySelector(s);
const app = $("#app");
const configured = ()=>CONFIG.SUPABASE_URL.startsWith("https://") && CONFIG.SUPABASE_ANON.length>20;
const H = ()=>({apikey:CONFIG.SUPABASE_ANON,Authorization:"Bearer "+CONFIG.SUPABASE_ANON,"Content-Type":"application/json"});
async function sb(path,opt={}){
  const r = await fetch(CONFIG.SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{...H(),...(opt.headers||{})}});
  if(!r.ok) throw new Error(r.status+" "+await r.text());
  const t = await r.text(); return t?JSON.parse(t):null;
}
const getEstado = ()=>sb(`plmj_estado?sessao=eq.${CONFIG.SESSAO}&select=*`).then(r=>r[0]);
const setEstado = (patch)=>sb(`plmj_estado?sessao=eq.${CONFIG.SESSAO}`,{method:"PATCH",body:JSON.stringify({...patch,atualizado:new Date().toISOString()}),headers:{Prefer:"return=minimal"}});
const getRespostas = (momento)=>sb(`plmj_respostas?sessao=eq.${CONFIG.SESSAO}${momento?`&momento=eq.${momento}`:""}&select=dispositivo,momento,item,valor,criado&limit=5000`);
async function upsert(rows){
  return sb(`plmj_respostas?on_conflict=sessao,dispositivo,momento,item`,{method:"POST",body:JSON.stringify(rows),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
}
function devId(){
  let id=null; try{id=localStorage.getItem("plmj_dev");}catch(e){}
  if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36); try{localStorage.setItem("plmj_dev",id);}catch(e){}}
  return id;
}
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (n,d)=>d?Math.round(100*n/d):0;

/* ---------- participante ---------- */
let pState={momento:null,answers:{},sent:{}};
function header(sub){return `<div class="top"><div><div class="brand">Pulso</div><div class="sub">${esc(sub||"PLMJ · Resolução de Problemas")}</div></div><div class="sub">anónimo</div></div>`;}
function renderParticipante(est){
  const m = est.momento_ativo;
  const info = MOMENTOS[m]||MOMENTOS.espera;
  if(m==="espera"||m==="fim"){
    app.innerHTML = header()+`<div class="card center"><h1>${esc(info.titulo)}</h1><p>${esc(info.desc)}</p>${m==="espera"?'<p class="muted">Mantenha esta página aberta.</p>':""}</div>`; return;
  }
  const key = m==="regua"?`regua_r${est.rodada}`:m;
  if(pState.sent[key]){
    app.innerHTML = header()+`<div class="card center"><h2>Recebido.</h2><p class="muted">Obrigado. Aguarde a próxima ronda.</p>${m==="regua"?'<button class="ghost" onclick="editar()">Corrigir a avaliação</button>':""}</div>`; return;
  }
  const qs = Q[m];
  const a = pState.answers[key]||(pState.answers[key]={});
  let html = header()+`<h1>${esc(info.titulo)}${m==="regua"?` <span class="tag">ronda ${est.rodada}</span>`:""}</h1><p class="muted">${esc(info.desc)}</p>`;
  qs.forEach((q,i)=>{
    html+=`<div class="q"><div class="t"><span class="n">${i+1}</span>${esc(q.t)}${q.opt?' <span class="muted">(opcional)</span>':""}</div>`;
    if(q.text){ html+=`<textarea rows="3" data-id="${q.id}" oninput="setAns('${key}','${q.id}',this.value)">${esc(a[q.id]||"")}</textarea>`; }
    else{
      html+=`<div class="${q.row?'row':''}">`;
      q.o.forEach(o=>{ html+=`<button type="button" class="opt ${a[q.id]===o?'sel':''}" onclick="pick('${key}','${q.id}',this)">${esc(o)}</button>`; });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  const done = qs.every(q=>q.opt||(a[q.id]&&String(a[q.id]).trim()));
  html+=`<button class="primary" id="send" ${done?"":"disabled"} onclick="enviar('${m}','${key}',${est.rodada})">Enviar</button><p class="muted center">Nenhuma resposta é ligada ao seu nome.</p>`;
  app.innerHTML=html;
}
window.setAns=(key,id,v)=>{(pState.answers[key]||(pState.answers[key]={}))[id]=v; refreshSend(key);};
window.pick=(key,id,btn)=>{ const a=(pState.answers[key]||(pState.answers[key]={})); a[id]=btn.textContent; btn.parentElement.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); refreshSend(key); };
function refreshSend(key){ const m=key.startsWith("regua")?"regua":key; const a=pState.answers[key]||{}; const done=Q[m].every(q=>q.opt||(a[q.id]&&String(a[q.id]).trim())); const b=$("#send"); if(b) b.disabled=!done; }
window.editar=()=>{ const k=Object.keys(pState.sent).pop(); delete pState.sent[k]; tick(); };
window.enviar=async(m,key,rodada)=>{
  const a=pState.answers[key]||{}; const dev=devId();
  const rows=Object.entries(a).filter(([k,v])=>String(v).trim()).map(([item,valor])=>({sessao:CONFIG.SESSAO,dispositivo:dev,momento:m,item:(m==="regua"?`r${rodada}_`:"")+item,valor:String(valor).slice(0,2000)}));
  const b=$("#send"); b.disabled=true; b.textContent="A enviar…";
  try{ await upsert(rows); pState.sent[key]=true; try{localStorage.setItem("plmj_sent",JSON.stringify(pState.sent));}catch(e){} tick(); }
  catch(e){ b.disabled=false; b.textContent="Enviar"; alert("Não foi possível enviar. Verifique a ligação e tente de novo."); console.error(e); }
};
try{ pState.sent=JSON.parse(localStorage.getItem("plmj_sent")||"{}"); }catch(e){}

/* ---------- telão ---------- */
function count(rows,item,opts){ const c={}; opts.forEach(o=>c[o]=0); let n=0; rows.filter(r=>r.item===item).forEach(r=>{ if(c[r.valor]!==undefined){c[r.valor]++; n++;} }); return {c,n}; }
function bars(title,item,opts,rows,alt){ const {c,n}=count(rows,item,opts); let h=`<div class="panel"><h3>${esc(title)} <span class="muted">· ${n}</span></h3>`; opts.forEach(o=>{ h+=`<div class="bar ${alt?'alt':''}"><div class="lab">${esc(o)}</div><div class="trk"><div class="fil" style="width:${pct(c[o],n)}%"></div></div><div class="val">${pct(c[o],n)}%</div></div>`; }); return h+`</div>`; }
function qOf(m,id){ return Q[m].find(q=>q.id===id); }
function renderTela(est,rows){
  const m=est.momento_ativo; const devs=new Set(rows.filter(r=>r.momento===(m==="regua"?"regua":m)).map(r=>r.dispositivo)).size;
  let h=`<div class="top"><div><div class="brand" style="font-size:1.6rem">Pulso · PLMJ</div><div class="sub">Resolução de Problemas · Nova SBE Executive Education</div></div><div class="sub">${esc((MOMENTOS[m]||{}).titulo||"")}${m==="regua"?" · ronda "+est.rodada:""}</div></div>`;
  const url=location.origin+location.pathname;
  if(m==="espera"){
    h+=`<div class="grid"><div class="panel qr"><h3>Entre no pulso</h3><div id="qr"></div><p class="muted">${esc(url)}</p><p>Anónimo. Sem nome. Sem login.</p></div><div class="panel"><h1>Problemas não são a exceção do trabalho.</h1><p class="big" style="font-size:1.6rem">São o trabalho.</p></div></div>`;
    app.innerHTML=h; new QRCode($("#qr"),{text:url,width:320,height:320,colorDark:"#231F20"}); return;
  }
  h+=`<div class="kpi"><div><b>${devs}</b>respostas</div></div>`;
  if(m==="p1"){
    h+=`<div class="grid">`;
    ["S1","S2","S3"].forEach(id=>h+=bars(qOf("p1",id).t,id,qOf("p1",id).o,rows));
    h+=bars("Último documento: a maior parte era…","M1",qOf("p1","M1").o,rows,true);
    h+=bars("…e a recomendação ocupava","M1b",qOf("p1","M1b").o,rows,true);
    h+=bars("Objetivo do cliente, numa frase?","C1",qOf("p1","C1").o,rows);
    h+=`</div>`;
  }
  if(m==="p2"){
    h+=`<div class="grid">`;
    h+=bars("Qual seria pior para quem assinou?","E1",qOf("p2","E1").o,rows,true);
    h+=bars("Se um colega levasse uma alternativa ao sócio…","E3",qOf("p2","E3").o,rows,true);
    h+=bars("Primeira conversa quando algo correu mal","E2",qOf("p2","E2").o,rows);
    h+=bars("Tempo a perceber o objetivo antes de escrever","T2",qOf("p2","T2").o,rows);
    h+=bars("Colegas que levam alternativa (estimativa)","P1",qOf("p2","P1").o,rows);
    h+=bars("Sócios que querem alternativas (estimativa)","P2",qOf("p2","P2").o,rows);
    h+=`</div>`;
  }
  if(m==="regua"){
    h+=`<div class="grid">`;
    for(let r=1;r<=est.rodada;r++){
      const rr=rows.filter(x=>x.item.startsWith(`r${r}_`));
      const byDev={}; rr.forEach(x=>{(byDev[x.dispositivo]||(byDev[x.dispositivo]={}))[x.item.slice(3)]=x.valor;});
      const votes=Object.values(byDev).filter(v=>v.alvo);
      const porTrio={}; let tot=0,nv=0;
      votes.forEach(v=>{ const s=["q1","q2","q3","q4"].reduce((a,q)=>a+(v[q]==="Sim"?1:0),0); tot+=s; nv++; (porTrio[v.alvo]||(porTrio[v.alvo]=[])).push(s); });
      h+=`<div class="panel"><h3>Ronda ${r} <span class="muted">· ${nv} avaliações · média ${nv?(tot/nv).toFixed(1):"–"} / 4</span></h3>`;
      Object.keys(porTrio).sort().forEach(t=>{ const arr=porTrio[t]; const avg=arr.reduce((a,b)=>a+b,0)/arr.length; h+=`<div class="bar"><div class="lab">Trio ${esc(t)}</div><div class="trk"><div class="fil" style="width:${avg/4*100}%"></div></div><div class="val">${avg.toFixed(1)}</div></div>`; });
      ["q1","q2","q3","q4"].forEach((q,i)=>{ const yes=votes.filter(v=>v[q]==="Sim").length; h+=`<div class="bar alt"><div class="lab muted">${esc(Q.regua[i+2].t)}</div><div class="trk"><div class="fil" style="width:${pct(yes,nv)}%"></div></div><div class="val">${pct(yes,nv)}%</div></div>`; });
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  if(m==="p3"){
    const p1=count(rows,"P1",qOf("p2","P1").o), a1=count(rows,"A1",qOf("p3","A1").o);
    h+=`<div class="grid"><div class="panel"><h3>Os colegas levam alternativa? <span class="muted">· ${p1.n}</span></h3>`;
    qOf("p2","P1").o.forEach(o=>h+=`<div class="bar"><div class="lab">${esc(o)}</div><div class="trk"><div class="fil" style="width:${pct(p1.c[o],p1.n)}%"></div></div><div class="val">${pct(p1.c[o],p1.n)}%</div></div>`);
    h+=`</div><div class="panel"><h3>E eu, comparado com eles? <span class="muted">· ${a1.n}</span></h3>`;
    qOf("p3","A1").o.forEach(o=>h+=`<div class="bar alt"><div class="lab">${esc(o)}</div><div class="trk"><div class="fil" style="width:${pct(a1.c[o],a1.n)}%"></div></div><div class="val">${pct(a1.c[o],a1.n)}%</div></div>`);
    h+=`</div>`;
    h+=bars("Confiança de usar na próxima semana","X2",qOf("p3","X2").o,rows);
    const o1=rows.filter(r=>r.item==="O1"&&r.valor&&r.valor.trim()), o2=rows.filter(r=>r.item==="O2"&&r.valor&&r.valor.trim());
    h+=`<div class="panel" style="grid-column:1/-1"><h3>Uma alternativa que não foi apresentada — o que teria sido preciso?</h3>${o1.map(r=>`<div class="verb">${esc(r.valor)}</div>`).join("")||'<p class="muted">—</p>'}</div>`;
    h+=`<div class="panel" style="grid-column:1/-1"><h3>O que precisaria de saber sobre o cliente?</h3>${o2.map(r=>`<div class="verb">${esc(r.valor)}</div>`).join("")||'<p class="muted">—</p>'}</div>`;
    h+=`</div>`;
  }
  if(m==="fim"){ h+=`<div class="panel center"><h1>Ninguém contrata um advogado para saber o que não pode.</h1></div>`; }
  app.innerHTML=h;
}

/* ---------- admin ---------- */
let adminOK=false;
function renderAdmin(est,rows){
  if(!adminOK){ app.innerHTML=header("controlo")+`<div class="card"><h2>PIN</h2><input type="text" id="pin" inputmode="numeric"><button class="primary" onclick="if($('#pin').value===CONFIG.ADMIN_PIN){adminOK=true;tick();}else alert('PIN errado')">Entrar</button></div>`; return; }
  const ms=["espera","p1","p2","regua","p3","fim"];
  let h=header("controlo")+`<h1>Controlo</h1><div class="adminbar">${ms.map(x=>`<button class="${est.momento_ativo===x?'on':''}" onclick="go('${x}')">${esc(MOMENTOS[x].titulo)}</button>`).join("")}</div>`;
  h+=`<div class="adminbar"><span style="align-self:center">Ronda da régua:</span>${[1,2,3].map(r=>`<button class="${est.rodada===r?'on':''}" onclick="ronda(${r})">${r}</button>`).join("")}</div>`;
  const by={}; rows.forEach(r=>{by[r.momento]=by[r.momento]||new Set(); by[r.momento].add(r.dispositivo);});
  h+=`<div class="card"><table class="t"><tr><th>Momento</th><th>Dispositivos</th><th>Linhas</th></tr>${["p1","p2","regua","p3"].map(x=>`<tr><td>${x}</td><td>${by[x]?by[x].size:0}</td><td>${rows.filter(r=>r.momento===x).length}</td></tr>`).join("")}</table></div>`;
  h+=`<div class="adminbar"><button onclick="exportar()">Exportar CSV (todas as respostas)</button><button onclick="window.open(location.pathname+'#tela','_blank')">Abrir ecrã</button><button onclick="window.open(location.pathname,'_blank')">Abrir como participante</button></div>`;
  h+=`<p class="muted">URL dos participantes: ${esc(location.origin+location.pathname)}</p>`;
  app.innerHTML=h;
}
window.go=async m=>{ await setEstado({momento_ativo:m}); tick(); };
window.ronda=async r=>{ await setEstado({rodada:r,momento_ativo:"regua"}); tick(); };
window.exportar=async()=>{
  const rows=await getRespostas(); const head="dispositivo,momento,item,valor,criado\n";
  const csv=head+rows.map(r=>[r.dispositivo,r.momento,r.item,r.valor,r.criado].map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const name=`pulso-plmj-${new Date().toISOString().slice(0,10)}.csv`;
  if(window.claude){ try{ const dl=await claude.use("downloads"); if(dl){ await dl.save({filename:name,data:"\ufeff"+csv}); return; } }catch(e){ console.warn(e); } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
};

/* ---------- loop ---------- */
const mode = ()=>location.hash==="#tela"?"tela":location.hash==="#admin"?"admin":"p";
let lastSig="";
async function tick(){
  if(!configured()){ app.innerHTML=header()+`<div class="err">Configuração em falta: preencher SUPABASE_URL e SUPABASE_ANON no topo do ficheiro.</div>`; return; }
  try{
    const est=await getEstado(); if(!est) throw new Error("estado não encontrado — correr o script SQL");
    if(mode()==="p"){ renderParticipante(est); }
    else{
      const m=est.momento_ativo; const rows = mode()==="admin"?await getRespostas(): (m==="p3"?await getRespostas():await getRespostas(m==="regua"?"regua":m));
      const sig=JSON.stringify([est.momento_ativo,est.rodada,rows.length,adminOK]);
      if(sig!==lastSig||mode()==="tela"){ lastSig=sig; mode()==="tela"?renderTela(est,rows):renderAdmin(est,rows); }
    }
  }catch(e){ app.innerHTML=header()+`<div class="err">Erro de ligação: ${esc(e.message)}</div>`; console.error(e); }
}
document.body.classList.toggle("tela",mode()==="tela");
window.addEventListener("hashchange",()=>{document.body.classList.toggle("tela",mode()==="tela"); lastSig=""; tick();});
tick();
setInterval(()=>{ if(mode()==="p"){ getEstado().then(est=>{ const k=est.momento_ativo+"|"+est.rodada; if(k!==pState.momento){pState.momento=k; renderParticipante(est);} }).catch(()=>{}); } else tick(); }, mode()==="p"?4000:3000);
</script>
